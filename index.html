<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#21180f">
    <title>The Fáilte Letters — Letters from Ireland</title>
        <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="desk-scene" aria-label="An antique writing desk with The Fáilte Letters book">
        <main class="stage">
            <div class="book-shell">
                <div class="inside" aria-live="polite">
                    <section class="page left-page">
                        <div class="page-inner" id="leftContent"></div>
                        <div class="page-footer" id="leftFooter">1</div>
                    </section>
                    <section class="page right-page">
                        <div class="page-inner" id="rightContent"></div>
                        <div class="page-footer" id="rightFooter">2</div>
                    </section>
                    <nav class="bookmark-tabs" aria-label="Book navigation">
                        <button class="tab" onclick="showHome()">All Counties</button>
                        <button class="tab" onclick="showAbout()">About This Archive</button>
                    </nav>
                </div>
                <button class="cover" id="cover" onclick="openBook()" aria-label="Open The Fáilte Letters book" title="Open me"></button>
            </div>
        </main>
    </div>

        <script src="js/archive.js" defer></script>
</body>
</html>
