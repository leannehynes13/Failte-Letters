!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#21180f">
<title>You Belong — Letters from Ireland</title>
<style>
:root{
  --ink:#493821; --ink-soft:#766044; --gold:#b8955d; --gold-light:#e3c991;
  --paper:#f0e3c8; --paper-light:#f8efdD; --paper-shadow:#c7ad82;
  --wood:#21180f; --green:#526044; --blue:#536c78;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--ink); overflow-x:hidden;
  background:#21170f;
  font-family:Georgia,"Times New Roman",serif;
}
button{font:inherit}
.desk-scene{
  min-height:100vh; width:100%; position:relative; isolation:isolate; overflow:hidden;
  display:flex; justify-content:center; align-items:center; padding:76px 5vw;
  background:
    radial-gradient(ellipse at 19% 12%,rgba(255,220,157,.28),transparent 28%),
    radial-gradient(ellipse at 50% 54%,rgba(207,151,74,.13),transparent 48%),
    repeating-linear-gradient(2deg,rgba(255,226,177,.035) 0 2px,transparent 2px 11px),
    repeating-linear-gradient(91deg,rgba(0,0,0,.13) 0 3px,transparent 3px 110px),
    linear-gradient(135deg,#3b2819 0%,#24170f 46%,#49301d 100%);
  box-shadow:inset 0 0 150px rgba(0,0,0,.72);
}
.desk-scene:before{
  content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:repeating-linear-gradient(7deg,transparent 0 42px,rgba(8,5,3,.18) 43px,transparent 46px 95px);
  opacity:.65;
}
.window-glow{
  position:absolute; z-index:-1; width:min(36vw,440px); height:min(44vh,390px); left:4%; top:2%;
  background:linear-gradient(135deg,rgba(255,239,197,.82),rgba(244,204,133,.23));
  filter:blur(25px); opacity:.72; pointer-events:none;
}
.window-frame{
  position:absolute; top:0; left:5%; width:min(31vw,390px); height:min(39vh,330px);
  border:12px solid rgba(65,43,26,.92); border-top:0; border-radius:0 0 5px 5px;
  background:linear-gradient(135deg,rgba(255,241,207,.58),rgba(231,190,118,.12));
  box-shadow:inset 0 0 0 3px rgba(213,176,119,.35),0 14px 34px rgba(0,0,0,.35);
  opacity:.8; pointer-events:none;
}
.window-frame:before,.window-frame:after{content:"";position:absolute;background:rgba(74,49,29,.8)}
.window-frame:before{width:8px;top:0;bottom:0;left:50%;transform:translateX(-50%)}
.window-frame:after{height:8px;left:0;right:0;top:48%}
.stage{width:min(1040px,100%); perspective:2200px; position:relative; z-index:2; filter:drop-shadow(0 30px 32px rgba(0,0,0,.48))}
.desk-prop{position:absolute;z-index:1;pointer-events:none;filter:drop-shadow(0 10px 9px rgba(0,0,0,.42))}
.scroll{width:190px;height:54px;border-radius:28px;background:linear-gradient(180deg,#ead9b6,#b99b6b 42%,#e7d3ad 70%,#8f7048);border:2px solid #8e6c42;box-shadow:inset 0 0 0 5px rgba(255,249,225,.3);}
.scroll:before{content:"";position:absolute;left:17px;right:17px;top:13px;height:24px;border-top:1px solid rgba(105,73,41,.45);border-bottom:1px solid rgba(105,73,41,.35);background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(112,76,43,.22) 6px 7px)}
.scroll:after{content:"";position:absolute;left:-9px;top:-5px;width:19px;height:60px;border-radius:50%;background:linear-gradient(90deg,#8b683f,#ead8b5,#9c784c);border:1px solid #8c6b43}
.scroll-left{left:3%;bottom:16%;transform:rotate(-17deg)}
.scroll-right{right:3%;top:18%;transform:rotate(13deg) scale(.82)}
.inkwell{width:48px;height:58px;border-radius:12px 12px 17px 17px;background:linear-gradient(90deg,#080d10,#26343a 35%,#10191d 70%,#05090b);border:2px solid #b08a50;box-shadow:inset 0 0 9px rgba(196,221,226,.28),0 0 18px rgba(225,177,91,.13)}
.inkwell:before{content:"";position:absolute;top:-8px;left:8px;width:28px;height:12px;border-radius:4px;background:linear-gradient(90deg,#9b7747,#e1c18a,#80603a);border:1px solid #5a4026}
.inkwell-left{left:13%;bottom:12%;transform:rotate(-8deg)}
.inkwell-right{right:13%;bottom:12%;transform:rotate(9deg) scale(.84)}
.quill{width:190px;height:18px;right:5%;bottom:23%;transform:rotate(-34deg);background:linear-gradient(90deg,transparent 0 10%,#b68a4f 10% 12%,#ead6a9 12% 80%,#8c693e 80% 82%,transparent 82%);border-radius:50%;}
.quill:before{content:"";position:absolute;left:17px;top:-34px;width:118px;height:54px;border-radius:100% 0 100% 0;transform:rotate(-18deg);background:repeating-linear-gradient(110deg,rgba(118,91,53,.55) 0 1px,transparent 1px 9px),linear-gradient(135deg,#f1e4c5,#bba276);clip-path:polygon(0 100%,20% 28%,53% 0,100% 0,66% 42%,20% 100%)}
.quill:after{content:"";position:absolute;right:0;top:6px;width:24px;height:5px;background:#d6b779;border-radius:100%}
.quill-right{right:5%;top:24%;transform:rotate(28deg) scale(.9)}

.book-shell{
  position:relative; padding:13px; border-radius:5px 13px 13px 5px;
  background:linear-gradient(90deg,#26180e,#8b663b 1.5%,#d0b17b 2%,#8d683c 2.5%,#302012 4%,#21170f 100%);
  box-shadow:0 28px 65px rgba(0,0,0,.62),0 5px 15px rgba(0,0,0,.4);
}
.book-shell:after{
  content:"";position:absolute;inset:7px 7px 7px auto;width:8px;
  background:repeating-linear-gradient(180deg,#e5d3ad 0 2px,#c5ad82 2px 4px);
  opacity:.55;border-radius:0 5px 5px 0;pointer-events:none
}
.cover{
  position:absolute;inset:0;z-index:5;cursor:pointer;overflow:hidden;
  transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.45s cubic-bezier(.68,-.08,.25,1),visibility 1.45s;
  border:1px solid #9a7442;border-radius:4px 12px 12px 4px;
  color:var(--gold-light);text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(179,132,70,.25),transparent 55%),
    repeating-linear-gradient(12deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),
    linear-gradient(110deg,#28190f,#54371f 46%,#392315 100%);
  box-shadow:inset 0 0 0 8px rgba(20,12,7,.42),inset 0 0 0 10px rgba(196,151,86,.55),inset 0 0 40px #140d08,10px 12px 30px #100a06;
}
.cover:before{content:"";position:absolute;inset:24px;border:1px solid rgba(213,176,112,.75);outline:1px solid rgba(213,176,112,.35);outline-offset:6px;pointer-events:none}
.cover:after{content:"";position:absolute;inset:42px;border:1px solid rgba(213,176,112,.2);pointer-events:none}
.cover.open{transform:rotateY(-145deg);visibility:hidden;pointer-events:none}
.cover:hover{
  box-shadow:inset 0 0 0 8px rgba(20,12,7,.42),inset 0 0 0 10px rgba(225,190,123,.8),inset 0 0 55px rgba(238,190,100,.24),0 0 28px rgba(231,184,99,.3),10px 12px 30px #100a06;
  filter:brightness(1.12);
}
.cover:hover .cover-prompt{color:#fff0c7;text-shadow:0 0 9px #e4bb6c,0 0 20px #c58b3c}
.cover-prompt{transition:color .3s,text-shadow .3s}
.cover-kicker{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:#c6a66e;margin-bottom:28px}
.cover-emblem{font-size:37px;line-height:1;margin:0 0 15px;color:#d0ad6f;text-shadow:0 2px 8px #1a1009}
.cover h1{font-weight:normal;text-transform:uppercase;letter-spacing:8px;line-height:1.15;font-size:clamp(39px,7vw,76px);margin:0;text-shadow:0 3px 9px #170e08}
.cover-subtitle{font-size:12px;letter-spacing:3px;line-height:2;margin-top:25px;color:#d6bd91;text-transform:uppercase}
.cover-rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,#c9a36a,transparent);margin:25px 0}
.cover-prompt{position:absolute;bottom:42px;font-size:15px;letter-spacing:1px;color:#e4d0a8;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.inside{
  min-height:660px;display:grid;grid-template-columns:1fr 1fr;gap:3px;
  padding:10px;background:linear-gradient(90deg,#9b794b,#d2b985 50%,#8d693e);
  box-shadow:inset 0 0 18px rgba(44,27,12,.65);position:relative;
}
.page{
  min-width:0;min-height:640px;position:relative;overflow:hidden;
  padding:34px clamp(19px,3vw,43px) 54px;text-align:center;
  background:
    radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.48),transparent 70%),
    repeating-linear-gradient(0deg,rgba(120,87,43,.025) 0 1px,transparent 1px 4px),
    linear-gradient(90deg,#dfcba6,#f5ead2 17%,#f3e7cd 80%,#e0cba5);
  box-shadow:inset 0 0 26px rgba(111,79,39,.18);
}
.left-page{border-radius:3px 0 0 3px;background-image:linear-gradient(90deg,rgba(119,83,42,.12),transparent 13%),radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.5),transparent 70%),linear-gradient(90deg,#dfcba6,#f5ead2 17%,#f3e7cd)}
.right-page{border-radius:0 3px 3px 0;background-image:linear-gradient(270deg,rgba(119,83,42,.12),transparent 13%),radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.5),transparent 70%),linear-gradient(90deg,#f3e7cd,#f5ead2 83%,#dfcba6)}
.page:before{content:"";position:absolute;inset:15px;border:1px solid rgba(156,119,67,.35);pointer-events:none}
.page:after{content:"";position:absolute;bottom:0;left:0;right:0;height:22px;background:linear-gradient(0deg,rgba(125,91,49,.12),transparent);pointer-events:none}
.page-inner{position:relative;z-index:1}
.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#8b704c;margin:4px 0 12px}
.page h2{font-size:clamp(21px,3vw,29px);font-weight:normal;letter-spacing:2px;text-transform:uppercase;margin:0 0 10px;color:#493821}
.page-intro{font-size:13px;line-height:1.7;color:#786348;margin:0 auto 18px;max-width:330px}
.ornament{color:#a48656;font-size:18px;letter-spacing:7px;margin:10px 0 14px}
.map-wrap{max-width:300px;margin:8px auto 10px;position:relative}
.ireland-map{width:100%;height:auto;max-height:300px;filter:drop-shadow(0 5px 3px rgba(67,53,30,.16))}
.map-caption{font-size:11px;font-style:italic;color:#806b4d;margin:4px 0 14px}
.county-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px auto 0;max-width:360px}
.county-grid button,.category-card,.tab,.text-link{
  border:1px solid rgba(157,123,75,.48);background:rgba(248,239,219,.66);color:#59452d;
  cursor:pointer;transition:background .2s,border-color .2s,transform .2s;
}
.county-grid button{padding:7px 2px;font-size:10px}
.county-grid button:hover,.county-grid button.active,.category-card:hover,.category-card:focus-visible{background:#dfc99e;border-color:#a98751;transform:translateY(-1px)}
.county-grid button.active{box-shadow:inset 0 0 0 1px #a98751}
.category-list{display:grid;gap:9px;margin:20px auto 0;max-width:390px;text-align:left}
.category-card{width:100%;display:grid;grid-template-columns:39px 1fr 16px;gap:10px;align-items:center;padding:11px 12px;text-align:left;border-radius:2px}
.category-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:#e8d9bb;color:#62704f}
.category-card:nth-child(2) .category-icon{color:#61758a}
.category-card:nth-child(3) .category-icon{color:#a77a39}
.category-card:nth-child(4) .category-icon{color:#9b7045}
.category-card strong{display:block;font-weight:normal;font-size:13px;margin-bottom:3px}
.category-card small{display:block;font-size:10px;line-height:1.4;color:#806b4d}
.chevron{color:#a3834e;font-size:18px}
.page-footer{position:absolute;bottom:22px;left:0;right:0;font-size:10px;letter-spacing:2px;color:#9a805b}
.page-nav{display:flex;justify-content:center;gap:13px;margin-top:17px}
.page-nav button,.back-button{
  border:0;background:transparent;color:#8c7048;text-decoration:underline;text-underline-offset:3px;
  cursor:pointer;font-size:12px;padding:6px
}
.page-nav button:hover,.back-button:hover{color:#493821}
.bookmark-tabs{position:absolute;right:-1px;top:95px;z-index:2;display:grid;gap:4px}
.tab{writing-mode:vertical-rl;padding:11px 7px;font-size:10px;letter-spacing:1px;background:#687452;color:#f5e8c9;border:0;box-shadow:2px 2px 4px #806644}
.tab:nth-child(2){background:#a27b4d}
.tab:hover{filter:brightness(1.12)}
.letter-list{display:grid;gap:8px;margin:18px auto;max-width:380px}
.letter-row{padding:12px 13px;text-align:left;background:rgba(255,250,237,.55);border:1px solid rgba(157,123,75,.4)}
.letter-row button{border:0;background:none;color:inherit;padding:0;text-align:left;cursor:pointer;width:100%}
.letter-row strong{font-size:13px;font-weight:normal;display:block;margin-bottom:4px}
.letter-row small{font-size:10px;color:#806b4d}
.letter-body{font-size:14px;line-height:1.9;text-align:left;white-space:pre-line;margin:22px auto;max-width:370px;color:#5b4932}
.letter-signoff{font-style:italic;text-align:right;color:#8a704b;font-size:13px}
.empty-note{font-size:13px;line-height:1.8;font-style:italic;color:#806b4d;padding:24px 10px}
.notice{font-size:10px;line-height:1.6;color:#8c7656;margin:18px auto 0;max-width:320px}
.hidden{display:none!important}
@media(max-width:720px){
 body{padding:14px 8px;align-items:flex-start}
 .desk-scene{padding:42px 8px;min-height:100svh}
 .window-frame{width:48vw;height:25vh;left:2%;border-width:8px}
 .scroll-left{left:-54px;bottom:5%;transform:rotate(-17deg) scale(.68)}
 .scroll-right{right:-65px;top:12%;transform:rotate(13deg) scale(.62)}
 .inkwell-left{left:2%;bottom:3%;transform:scale(.7)}
 .inkwell-right{right:2%;bottom:3%;transform:scale(.7)}
 .quill-right{right:-45px;top:25%;transform:rotate(28deg) scale(.6)}
 .book-shell{padding:7px}
 .inside{grid-template-columns:1fr;gap:3px;padding:7px}
 .page{min-height:540px;padding:29px 22px 52px}
 .left-page{border-radius:3px 3px 0 0}
 .right-page{border-radius:0 0 3px 3px}
 .cover{position:absolute;min-height:100%;padding:28px 18px}
 .cover.open{transform:rotateY(-145deg)}
 .cover:before{inset:17px}.cover:after{inset:30px}
 .cover h1{letter-spacing:5px}
 .cover-prompt{bottom:30px}
 .bookmark-tabs{right:0;top:60px}
 .tab{font-size:9px;padding:9px 5px}
 .map-wrap{max-width:230px}
 .county-grid{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="desk-scene" aria-label="An enchanted writing desk with an antique book">
  <div class="window-glow"></div>
  <div class="window-frame"></div>
  <div class="desk-prop scroll scroll-left"></div>
  <div class="desk-prop scroll scroll-right"></div>
  <div class="desk-prop inkwell inkwell-left"></div>
  <div class="desk-prop inkwell inkwell-right"></div>
  <div class="desk-prop quill quill-right"></div>
<main class="stage">
  <div class="book-shell">
    <div class="inside" aria-live="polite">
      <section class="page left-page">
        <div class="page-inner" id="leftContent"></div>
        <div class="page-footer" id="leftFooter">1</div>
      </section>
      <section class="page right-page">
        <div class="page-inner" id="rightContent"></div>
        <div class="page-footer" id="rightFooter">2</div>
      </section>
      <nav class="bookmark-tabs" aria-label="Book navigation">
        <button class="tab" onclick="showHome()">All Counties</button>
        <button class="tab" onclick="showAbout()">About This Archive</button>
      </nav>
    </div>
    <button class="cover" id="cover" onclick="openBook()" aria-label="Open the book">
      <span class="cover-kicker">A living collection from Ireland</span>
      <span class="cover-emblem">✥</span>
      <h1>You<br>Belong</h1>
      <span class="cover-subtitle">Letters of welcome<br>from across Ireland</span>
      <span class="cover-rule"></span>
      <span class="cover-emblem">☘</span>
      <span class="cover-prompt">Open me&nbsp; &nbsp; ✧</span>
    </button>
  </div>
</main>
</div>

<script>
const counties = [
 "Antrim","Armagh","Carlow","Cavan","Clare","Cork","Derry","Donegal",
 "Down","Dublin","Fermanagh","Galway","Kerry","Kildare","Kilkenny","Laois",
 "Leitrim","Limerick","Longford","Louth","Mayo","Meath","Monaghan","Offaly",
 "Roscommon","Sligo","Tipperary","Tyrone","Waterford","Westmeath","Wexford","Wicklow"
];

const categories = [
 {icon:"◉",title:"If you've left home behind",desc:"Letters acknowledging the courage it takes to build a life somewhere new."},
 {icon:"♥",title:"If someone has made you feel unwelcome",desc:"Messages of solidarity, kindness and understanding."},
 {icon:"☼",title:"If you need hope today",desc:"Sometimes people don't need advice. They just need hope."},
 {icon:"☕",title:"If you'd like a friend",desc:"People sharing what they'd say if they met you over a cup of tea."}
];

// Sample content is illustrative. Replace with approved submissions when ready.
const sampleLetters = {
 "If you've left home behind":[
  {title:"A note for a new beginning",from:"A reader in Galway",body:"Leaving somewhere familiar takes courage. There is so much you carry with you: the language, the food, the people and the memories that made you who you are.\n\nI hope that, with time, this place becomes somewhere you can make new memories too. You do not have to leave one home behind to make room for another.\n\nThere is room for you here.",sign:"With warmth, someone in Ireland"},
  {title:"You can belong in more than one place",from:"A reader in Cork",body:"You can miss home and still be happy here. You can feel grateful and lonely at the same time. None of those feelings cancel the others out.\n\nI hope you find people who make ordinary days feel a little easier.",sign:"A friend you haven't met yet"}
 ],
 "If someone has made you feel unwelcome":[
  {title:"You deserve kindness",from:"A reader in Dublin",body:"I am sorry if somebody has made you feel that you do not belong. Their actions do not define your worth, and they do not speak for everyone.\n\nYou deserve to feel safe, respected and welcome in the places where you live, work and spend your days.",sign:"With solidarity"},
  {title:"There is room for everyone",from:"A reader in Mayo",body:"A place becomes better when people look after one another. I hope you meet many people who show you that through small, everyday acts of kindness.",sign:"Someone wishing you well"}
 ],
 "If you need hope today":[
  {title:"One day at a time",from:"A reader in Waterford",body:"You do not have to figure everything out today. Take the small good moments when they come. A friendly face, a warm cup of tea, a place to rest.\n\nI hope tomorrow is gentler.",sign:"Thinking of you"}
 ],
 "If you'd like a friend":[
  {title:"Tea is always a good start",from:"A reader in Limerick",body:"If we met, I would put the kettle on. We could talk about where you have been, what you miss, what makes you laugh, or absolutely nothing at all.\n\nYou are welcome at the table.",sign:"A friend in Ireland"}
 ]
};

let selectedCounty = "Mayo";
let currentCategory = "";
let currentLetter = null;
let pageNumber = 1;

function openBook(){
 document.getElementById("cover").classList.add("open");
 renderHome();
}
function closeBook(){
 document.getElementById("cover").classList.remove("open");
}
function setPages(left,right,leftNum="1",rightNum="2"){
 document.getElementById("leftContent").innerHTML=left;
 document.getElementById("rightContent").innerHTML=right;
 document.getElementById("leftFooter").textContent=leftNum;
 document.getElementById("rightFooter").textContent=rightNum;
}
function mapSVG(){
 return `<svg class="ireland-map" viewBox="0 0 300 330" role="img" aria-label="Illustrated outline map of Ireland">
 <defs><linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9a879"/><stop offset="1" stop-color="#687653"/></linearGradient></defs>
 <path d="M155 12 L181 23 190 43 215 48 224 67 244 78 239 98 256 116 244 136 250 154 233 169 239 190 220 207 218 228 201 239 198 260 180 273 166 297 143 307 127 292 108 293 97 275 78 268 72 247 52 234 59 215 42 199 53 181 42 165 57 149 49 130 65 116 68 95 85 85 91 63 111 53 116 34 138 29 Z" fill="url(#land)" stroke="#526344" stroke-width="3"/>
 <path d="M155 12 L181 23 190 43 215 48 224 67 244 78 239 98 256 116 244 136 250 154 233 169 239 190 220 207 218 228 201 239 198 260 180 273 166 297 143 307 127 292 108 293 97 275 78 268 72 247 52 234 59 215 42 199 53 181 42 165 57 149 49 130 65 116 68 95 85 85 91 63 111 53 116 34 138 29 Z" fill="none" stroke="#e0d0a9" stroke-width="1.2" stroke-dasharray="2 3"/>
 <path d="M92 80 L135 95 178 87 222 103 M65 150 L111 157 151 145 203 157 243 148 M54 201 L104 196 148 208 215 198 M78 251 L125 239 179 255" fill="none" stroke="#e1d2ad" stroke-width="1.5" opacity=".75"/>
 <g fill="#f1e5c8" font-family="Georgia,serif" font-size="9" text-anchor="middle"><text x="155" y="62">ULSTER</text><text x="146" y="139">CONNACHT</text><text x="153" y="196">LEINSTER</text><text x="122" y="260">MUNSTER</text></g>
 <circle cx="188" cy="181" r="4" fill="#d9b66f" stroke="#fff1ce" stroke-width="1.5"/>
 </svg>`;
}
function renderHome(){
 currentCategory="";currentLetter=null;
 const left=`<div class="eyebrow">A collection of voices</div><h2>Where in Ireland?</h2><p class="page-intro">Choose a county to discover letters from people connected to that part of Ireland.</p><div class="ornament">❧ ✧ ❧</div><div class="map-wrap">${mapSVG()}</div><p class="map-caption">Every letter. Every county. Every voice matters.</p><div class="county-grid">${counties.map(c=>`<button class="${c===selectedCounty?'active':''}" onclick="selectCounty('${c}')">${c}</button>`).join("")}</div>`;
 const right=`<div class="eyebrow">County ${selectedCounty}</div><h2>Letters from ${selectedCounty}</h2><p class="page-intro">Choose a page that speaks to you. There is no right place to begin.</p><div class="ornament">✧</div><div class="category-list">${categories.map(c=>`<button class="category-card" onclick="showCategory('${c.title.replace(/'/g,"\\'")}')"><span class="category-icon">${c.icon}</span><span><strong>${c.title}</strong><small>${c.desc}</small></span><span class="chevron">›</span></button>`).join("")}</div><p class="notice">This archive is being built with care. The sample letters shown here are illustrative, not real submissions.</p>`;
 setPages(left,right,"1","2");
}
function selectCounty(county){selectedCounty=county;renderHome()}
function showCategory(title){
 currentCategory=title;currentLetter=null;
 const entries=sampleLetters[title]||[];
 const left=`<div class="eyebrow">The archive · ${selectedCounty}</div><h2>${title}</h2><div class="ornament">❧</div><p class="page-intro">A collection of messages written to remind people that they are seen, valued and welcome.</p><div class="empty-note">${entries.length?`${entries.length} example letters in this preview.`:"New letters for this section will appear here as the archive grows."}</div><button class="back-button" onclick="renderHome()">← Back to the county map</button>`;
 const right=entries.length?`<div class="eyebrow">Turn the page</div><h2>Choose a letter</h2><div class="letter-list">${entries.map((l,i)=>`<div class="letter-row"><button onclick="readLetter(${i})"><strong>${l.title}</strong><small>${l.from} &nbsp; · &nbsp; Read letter ›</small></button></div>`).join("")}</div><p class="notice">These preview letters are examples only. Real contributions will be published only with the writer's permission.</p>`:`<div class="eyebrow">A page waiting to be written</div><h2>Your words belong here</h2><p class="empty-note">As people contribute to the archive, their letters will find a home on these pages.</p>`;
 setPages(left,right,"3","4");
}
function readLetter(index){
 const l=(sampleLetters[currentCategory]||[])[index];if(!l)return;
 currentLetter=l;
 const left=`<div class="eyebrow">${selectedCounty} · From the archive</div><h2>${l.title}</h2><div class="ornament">❧</div><p class="page-intro">${l.from}</p><div class="letter-body">${l.body}</div><div class="letter-signoff">${l.sign}</div><button class="back-button" onclick="showCategory('${currentCategory.replace(/'/g,"\\'")}')">← Back to letters</button>`;
 const right=`<div class="eyebrow">A message for you</div><h2>Take these words with you</h2><p class="empty-note">Every letter is a small act of connection. Thank you for taking the time to read this one.</p><div class="ornament">✧ ☘ ✧</div><button class="back-button" onclick="showCategory('${currentCategory.replace(/'/g,"\\'")}')">Read another letter</button>`;
 setPages(left,right,"5","6");
}
function showAbout(){
 const left=`<div class="eyebrow">The story behind the pages</div><h2>About this archive</h2><div class="ornament">❧</div><p class="letter-body">You Belong is a growing collection of letters and messages from people across Ireland and around the world.</p><p class="letter-body">It is a place for people to offer kindness, share encouragement and remind others that they deserve to feel welcome.</p>`;
 const right=`<div class="eyebrow">A living collection</div><h2>Every voice matters</h2><p class="letter-body">The archive will grow through contributions from individuals, schools, families and communities.</p><p class="letter-body">Our hope is to preserve these words and share them with anyone who might need to read them.</p><div class="ornament">✧</div><p class="page-intro">Letters from Ireland · Litreacha ó Éirinn</p><button class="back-button" onclick="renderHome()">← Return to the book</button>`;
 setPages(left,right,"About","About");
}
function showHome(){renderHome()}
</script>
</body>
</html>
