
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fáilte Letters</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="desk-scene">

    <img
        src="images/desk-background.png"
        class="desk-background"
        alt="The Fáilte Letters resting on a desk"
    >

    <div class="book-shell" id="bookShell">

        <button
            type="button"
            class="cover"
            id="cover"
            onclick="openBook()"
            aria-label="Open The Fáilte Letters"
        >
            <span>✧ Open me ✧</span>
        </button>

        <section class="inside" id="inside">

            <img
                src="images/open-book.png"
                class="open-book-image"
                alt="The open pages of The Fáilte Letters"
            >

            <div class="archive-content">

                <div class="left-page">
                    <div class="page-inner" id="leftContent"></div>
                </div>

                <div class="right-page">
                    <div class="page-inner" id="rightContent"></div>
                </div>

            </div>

        </section>

    </div>

</main>

<script src="js/archive.js"></script>

</body>
</html>
