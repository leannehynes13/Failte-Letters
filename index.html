
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#21180f">
<title>The Fáilte Letters — Letters from Ireland</title>

<style>
.desk-scene {
    min-height: 100vh;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 3vw;
    background-color: #21180f;
    background-image: url("images/desk-background.png");
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: background .5s ease;
}

/* When the book opens, remove the landing-page image */
.desk-scene.book-open {
    background-image: none;
    background-color: #302317;
    padding: 35px 3vw;
}

.desk-scene.book-open::before {
    display: none;
}
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--wood);
    color: var(--ink);
    overflow-x: hidden;
}

button {
    font: inherit;
}

/* LANDING PAGE */

.desk-scene {
    min-height: 100vh;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 3vw;
    isolation: isolate;
    background-color: #21180f;
    background-image: url("images/desk-background.png");
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
}

.desk-scene::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        transparent 45%,
        rgba(12, 7, 3, .25) 100%
    );
}

.stage {
    width: min(1100px, 100%);
    min-height: min(85vh, 850px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
}

.book-shell {
    position: relative;
    width: 100%;
    max-width: 1040px;
}

/* INVISIBLE CLICKABLE AREA OVER THE BOOK IN THE ORIGINAL IMAGE */

.cover {
    position: absolute;
    z-index: 10;
    left: 24%;
    top: 4%;
    width: 53%;
    height: 78%;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 10px;
    padding: 0;
    transition: opacity .5s ease;
}

.cover::before {
    content: "";
    position: absolute;
    inset: -3%;
    border: 1px solid transparent;
    border-radius: 12px;
    transition: .35s ease;
    pointer-events: none;
}

.cover::after {
    content: "✧ Open me ✧";
    position: absolute;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    color: #f1d18d;
    font-size: clamp(13px, 1.8vw, 19px);
    letter-spacing: 3px;
    white-space: nowrap;
    opacity: 0;
    text-shadow: 0 0 10px #f4d28e, 0 0 24px #d7a54f;
    transition: opacity .3s ease;
    pointer-events: none;
}

.cover:hover::before,
.cover:focus-visible::before {
    border-color: rgba(239, 201, 125, .75);
    box-shadow: 0 0 25px rgba(231, 184, 99, .35);
}

.cover:hover::after,
.cover:focus-visible::after {
    opacity: 1;
    animation: sparkle 1.2s ease-in-out infinite alternate;
}

.cover:focus-visible {
    outline: none;
}

.cover.hidden {
    display: none;
}

@keyframes sparkle {
    from {
        filter: brightness(.8);
    }
    to {
        filter: brightness(1.5);
    }
}

/* OPEN BOOK */

.inside {
    display: none;
    width: 100%;
    min-height: 690px;
    position: relative;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    padding: 12px;
    background: linear-gradient(
        90deg,
        #8d693e,
        #d2b985 50%,
        #8d693e
    );
    box-shadow:
        0 25px 65px rgba(0,0,0,.55),
        inset 0 0 20px rgba(44,27,12,.55);
    animation: bookAppear .7s ease;
}

.inside.archive-open {
    display: grid;
}

@keyframes bookAppear {
    from {
        opacity: 0;
        transform: scale(.92) translateY(20px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.page {
    min-width: 0;
    min-height: 660px;
    position: relative;
    overflow-y: auto;
    padding: 42px clamp(20px, 3vw, 46px) 65px;
    text-align: center;
    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.55),
            transparent 75%
        ),
        linear-gradient(
            90deg,
            #e5d4b5,
            #f8f0df 18%,
            #f4ead6 82%,
            #e5d4b5
        );
    box-shadow: inset 0 0 25px rgba(111,79,39,.16);
}

.left-page {
    border-radius: 3px 0 0 3px;
}

.right-page {
    border-radius: 0 3px 3px 0;
}

.page::before {
    content: "";
    position: absolute;
    inset: 16px;
    border: 1px solid rgba(156,119,67,.35);
    pointer-events: none;
}

.page-inner {
    position: relative;
    z-index: 1;
}

.page-footer {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    font-size: 10px;
    letter-spacing: 2px;
    color: #9a805b;
}

.eyebrow {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8b704c;
    margin: 4px 0 15px;
}

.page h2 {
    font-size: clamp(21px, 2.5vw, 29px);
    font-weight: normal;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    line-height: 1.35;
    margin: 0 0 12px;
    color: var(--ink);
}

.page-intro {
    font-size: 13px;
    line-height: 1.8;
    color: #786348;
    margin: 0 auto 18px;
    max-width: 350px;
}

.ornament {
    color: #a48656;
    font-size: 19px;
    letter-spacing: 7px;
    margin: 12px 0 17px;
}

.map-wrap {
    max-width: 280px;
    margin: 8px auto 12px;
}

.ireland-map {
    width: 100%;
    height: auto;
    max-height: 300px;
    filter: drop-shadow(0 5px 3px rgba(67,53,30,.16));
}

.map-caption {
    font-size: 11px;
    font-style: italic;
    color: #806b4d;
    margin: 4px 0 15px;
}

/* COUNTY SELECTOR */

.county-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin: 12px auto 0;
    max-width: 380px;
}

.county-grid button {
    padding: 7px 2px;
    font-size: 10px;
    border: 1px solid rgba(157,123,75,.48);
    background: rgba(248,239,219,.66);
    color: #59452d;
    cursor: pointer;
    transition: .2s ease;
}

.county-grid button:hover,
.county-grid button.active {
    background: #dfc99e;
    border-color: #a98751;
    box-shadow: inset 0 0 0 1px #a98751;
}

/* CATEGORIES */

.category-list {
    display: grid;
    gap: 10px;
    margin: 22px auto 0;
    max-width: 400px;
    text-align: left;
}

.category-card {
    width: 100%;
    display: grid;
    grid-template-columns: 38px 1fr 16px;
    gap: 10px;
    align-items: center;
    padding: 13px;
    text-align: left;
    border: 1px solid rgba(157,123,75,.48);
    border-radius: 2px;
    background: rgba(248,239,219,.72);
    color: #59452d;
    cursor: pointer;
    transition: .2s ease;
}

.category-card:hover {
    background: #e9d9b8;
    border-color: #a98751;
    transform: translateY(-2px);
}

.category-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 18px;
    background: #e8d9bb;
    color: #62704f;
}

.category-card strong {
    display: block;
    font-weight: normal;
    font-size: 13px;
    margin-bottom: 4px;
}

.category-card small {
    display: block;
    font-size: 10px;
    line-height: 1.5;
    color: #806b4d;
}

.chevron {
    color: #a3834e;
    font-size: 19px;
}

/* LETTERS */

.letter-list {
    display: grid;
    gap: 10px;
    margin: 20px auto;
    max-width: 390px;
}

.letter-row {
    padding: 14px;
    text-align: left;
    background: rgba(255,250,237,.65);
    border: 1px solid rgba(157,123,75,.4);
}

.letter-row button {
    border: 0;
    background: none;
    color: inherit;
    padding: 0;
    text-align: left;
    cursor: pointer;
    width: 100%;
}

.letter-row strong {
    font-size: 14px;
    font-weight: normal;
    display: block;
    margin-bottom: 5px;
}

.letter-row small {
    font-size: 10px;
    color: #806b4d;
}

.letter-body {
    font-size: 14px;
    line-height: 1.9;
    text-align: left;
    white-space: pre-line;
    margin: 22px auto;
    max-width: 390px;
    color: #5b4932;
}

.letter-signoff {
    font-style: italic;
    text-align: right;
    color: #8a704b;
    font-size: 13px;
    margin-top: 25px;
}

.empty-note {
    font-size: 13px;
    line-height: 1.8;
    font-style: italic;
    color: #806b4d;
    padding: 24px 10px;
}

.notice {
    font-size: 10px;
    line-height: 1.7;
    color: #8c7656;
    margin: 20px auto 0;
    max-width: 330px;
}

.back-button {
    border: 0;
    background: transparent;
    color: #8c7048;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    font-size: 12px;
    padding: 8px;
    margin-top: 15px;
}

.back-button:hover {
    color: #493821;
}

/* BOOKMARK TABS AND CLOSE BUTTON */

.bookmark-tabs {
    position: absolute;
    right: -1px;
    top: 95px;
    z-index: 4;
    display: grid;
    gap: 4px;
}

.tab {
    writing-mode: vertical-rl;
    padding: 11px 7px;
    font-size: 10px;
    letter-spacing: 1px;
    background: #687452;
    color: #f5e8c9;
    border: 0;
    cursor: pointer;
    box-shadow: 2px 2px 4px #806644;
}

.tab:nth-child(2) {
    background: #a27b4d;
}

.close-book {
    position: absolute;
    top: 16px;
    right: 18px;
    z-index: 8;
    border: 1px solid rgba(156,119,67,.55);
    background: rgba(248,239,219,.92);
    color: #59452d;
    padding: 8px 12px;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
}

.close-book:hover {
    background: #dfc99e;
}

.hidden {
    display: none !important;
}

/* MOBILE */

@media (max-width: 720px) {
    .desk-scene {
        min-height: 100svh;
        padding: 15px 8px;
        background-position: center center;
    }

    .stage {
        min-height: 75svh;
        width: 100%;
    }

    .book-shell {
        width: 100%;
    }

    .cover {
        left: 20%;
        top: 7%;
        width: 61%;
        height: 70%;
    }

    .inside.archive-open {
        grid-template-columns: 1fr;
        gap: 3px;
        padding: 7px;
    }

    .page {
        min-height: 530px;
        padding: 32px 23px 55px;
    }

    .left-page {
        border-radius: 3px 3px 0 0;
    }

    .right-page {
        border-radius: 0 0 3px 3px;
    }

    .bookmark-tabs {
        right: 0;
        top: 55px;
    }

    .tab {
        font-size: 9px;
        padding: 9px 5px;
    }

    .map-wrap {
        max-width: 220px;
    }

    .county-grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .close-book {
        top: 12px;
        right: 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="desk-scene">

    <main class="stage">
        <div class="book-shell">

            <!-- THE OPEN BOOK -->

            <div class="inside" id="inside" aria-live="polite">

                <button class="close-book" onclick="closeBook()">
                    Close book ✕
                </button>

                <section class="page left-page">
                    <div class="page-inner" id="leftContent"></div>
                    <div class="page-footer" id="leftFooter">1</div>
                </section>

                <section class="page right-page">
                    <div class="page-inner" id="rightContent"></div>
                    <div class="page-footer" id="rightFooter">2</div>
                </section>

                <nav class="bookmark-tabs" aria-label="Book navigation">
                    <button class="tab" onclick="showHome()">All Counties</button>
                    <button class="tab" onclick="showAbout()">About This Archive</button>
                </nav>

            </div>

            <!-- CLICKABLE AREA OVER THE CLOSED BOOK IN THE DESK IMAGE -->

            <button
                class="cover"
                id="cover"
                onclick="openBook()"
                aria-label="Open The Fáilte Letters book"
                title="Open me">
            </button>

        </div>
    </main>

</div>

<script>

/* COUNTIES */

const counties = [
    "Antrim", "Armagh", "Carlow", "Cavan", "Clare", "Cork", "Derry", "Donegal",
    "Down", "Dublin", "Fermanagh", "Galway", "Kerry", "Kildare", "Kilkenny",
    "Laois", "Leitrim", "Limerick", "Longford", "Louth", "Mayo", "Meath",
    "Monaghan", "Offaly", "Roscommon", "Sligo", "Tipperary", "Tyrone",
    "Waterford", "Westmeath", "Wexford", "Wicklow"
];


/* LETTER CATEGORIES */

const categories = [
    {
        icon: "◉",
        title: "If you've left home behind",
        desc: "Letters acknowledging the courage it takes to build a life somewhere new."
    },
    {
        icon: "♥",
        title: "If someone has made you feel unwelcome",
        desc: "Messages of solidarity, kindness and understanding."
    },
    {
        icon: "☼",
        title: "If you need hope today",
        desc: "Sometimes people don't need advice. They just need hope."
    },
    {
        icon: "☕",
        title: "If you'd like a friend",
        desc: "People sharing what they'd say if they met you over a cup of tea."
    }
];


/* PREVIEW LETTERS
   These are illustrative examples, not real submissions.
*/

const sampleLetters = {

    "If you've left home behind": [
        {
            title: "A note for a new beginning",
            from: "A reader in Galway",
            body: `Leaving somewhere familiar takes courage. There is so much you carry with you: the language, the food, the people and the memories that made you who you are.

I hope that, with time, this place becomes somewhere you can make new memories too. You do not have to leave one home behind to make room for another.

There is room for you here.`,
            sign: "With warmth, someone in Ireland"
        },
        {
            title: "You can belong in more than one place",
            from: "A reader in Cork",
            body: `You can miss home and still be happy here. You can feel grateful and lonely at the same time. None of those feelings cancel the others out.

I hope you find people who make ordinary days feel a little easier.`,
            sign: "A friend you haven't met yet"
        }
    ],

    "If someone has made you feel unwelcome": [
        {
            title: "You deserve kindness",
            from: "A reader in Dublin",
            body: `I am sorry if somebody has made you feel that you do not belong. Their actions do not define your worth, and they do not speak for everyone.

You deserve to feel safe, respected and welcome in the places where you live, work and spend your days.`,
            sign: "With solidarity"
        },
        {
            title: "There is room for everyone",
            from: "A reader in Mayo",
            body: `A place becomes better when people look after one another. I hope you meet many people who show you that through small, everyday acts of kindness.`,
            sign: "Someone wishing you well"
        }
    ],

    "If you need hope today": [
        {
            title: "One day at a time",
            from: "A reader in Waterford",
            body: `You do not have to figure everything out today. Take the small good moments when they come. A friendly face, a warm cup of tea, a place to rest.

I hope tomorrow is gentler.`,
            sign: "Thinking of you"
        }
    ],

    "If you'd like a friend": [
        {
            title: "Tea is always a good start",
            from: "A reader in Limerick",
            body: `If we met, I would put the kettle on. We could talk about where you have been, what you miss, what makes you laugh, or absolutely nothing at all.

You are welcome at the table.`,
            sign: "A friend in Ireland"
        }
    ]
};


/* BOOK STATE */

let selectedCounty = "Mayo";
let currentCategory = "";


/* OPEN AND CLOSE THE BOOK */

function openBook() {
    document.getElementById("cover").classList.add("hidden");
    document.getElementById("inside").classList.add("archive-open");
    renderHome();
}

function closeBook() {
    document.getElementById("inside").classList.remove("archive-open");
    document.getElementById("cover").classList.remove("hidden");
}


/* UPDATE THE TWO PAGES */

function setPages(left, right, leftNum = "1", rightNum = "2") {
    document.getElementById("leftContent").innerHTML = left;
    document.getElementById("rightContent").innerHTML = right;
    document.getElementById("leftFooter").textContent = leftNum;
    document.getElementById("rightFooter").textContent = rightNum;
}


/* ILLUSTRATIVE MAP
   This is a decorative outline, not a geographically accurate county map.
*/

function mapSVG() {
    return `
    <svg class="ireland-map" viewBox="0 0 300 330"
         role="img" aria-label="Illustrated outline map of Ireland">

        <defs>
            <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#a9a879"/>
                <stop offset="1" stop-color="#687653"/>
            </linearGradient>
        </defs>

        <path d="
        M155 12 L181 23 190 43 215 48 224 67
        244 78 239 98 256 116 244 136 250 154
        233 169 239 190 220 207 218 228 201 239
        198 260 180 273 166 297 143 307 127 292
        108 293 97 275 78 268 72 247 52 234
        59 215 42 199 53 181 42 165 57 149
        49 130 65 116 68 95 85 85 91 63
        111 53 116 34 138 29 Z"
        fill="url(#land)"
        stroke="#526344"
        stroke-width="3"/>

        <path d="
        M92 80 L135 95 178 87 222 103
        M65 150 L111 157 151 145 203 157 243 148
        M54 201 L104 196 148 208 215 198
        M78 251 L125 239 179 255"
        fill="none"
        stroke="#e1d2ad"
        stroke-width="1.5"
        opacity=".75"/>

        <g fill="#f1e5c8" font-family="Georgia,serif"
           font-size="9" text-anchor="middle">
            <text x="155" y="62">ULSTER</text>
            <text x="146" y="139">CONNACHT</text>
            <text x="153" y="196">LEINSTER</text>
            <text x="122" y="260">MUNSTER</text>
        </g>

        <circle cx="188" cy="181" r="4"
                fill="#d9b66f" stroke="#fff1ce" stroke-width="1.5"/>

    </svg>`;
}


/* COUNTY HOME PAGE */

function renderHome() {

    currentCategory = "";

    const left = `
        <div class="eyebrow">A collection of voices</div>
        <h2>Where in Ireland?</h2>

        <p class="page-intro">
            Choose a county to discover letters from people
            connected to that part of Ireland.
        </p>

        <div class="ornament">❧ ✧ ❧</div>

        <div class="map-wrap">
            ${mapSVG()}
        </div>

        <p class="map-caption">
            Every letter. Every county. Every voice matters.
        </p>

        <div class="county-grid">
            ${counties.map(c => `
                <button
                    class="${c === selectedCounty ? 'active' : ''}"
                    onclick="selectCounty('${c}')">
                    ${c}
                </button>
            `).join("")}
        </div>
    `;

    const right = `
        <div class="eyebrow">County ${selectedCounty}</div>

        <h2>Letters from ${selectedCounty}</h2>

        <p class="page-intro">
            Choose a page that speaks to you.
            There is no right place to begin.
        </p>

        <div class="ornament">✧</div>

        <div class="category-list">
            ${categories.map(c => `
                <button class="category-card"
                    onclick="showCategory('${c.title.replace(/'/g, "\\'")}')">

                    <span class="category-icon">${c.icon}</span>

                    <span>
                        <strong>${c.title}</strong>
                        <small>${c.desc}</small>
                    </span>

                    <span class="chevron">›</span>
                </button>
            `).join("")}
        </div>

        <p class="notice">
            This archive is being built with care. The sample
            letters shown here are illustrative, not real submissions.
        </p>
    `;

    setPages(left, right, "1", "2");
}


/* SELECT A COUNTY */

function selectCounty(county) {
    selectedCounty = county;
    renderHome();
}


/* OPEN A LETTER CATEGORY */

function showCategory(title) {

    currentCategory = title;

    const entries = sampleLetters[title] || [];

    const left = `
        <div class="eyebrow">The archive · ${selectedCounty}</div>

        <h2>${title}</h2>

        <div class="ornament">❧</div>

        <p class="page-intro">
            A collection of messages written to remind people
            that they are seen, valued and welcome.
        </p>

        <div class="empty-note">
            ${entries.length
                ? `${entries.length} example letters in this preview.`
                : "New letters for this section will appear here as the archive grows."}
        </div>

        <button class="back-button" onclick="renderHome()">
            ← Back to the county map
        </button>
    `;

    const right = entries.length ? `
        <div class="eyebrow">Turn the page</div>

        <h2>Choose a letter</h2>

        <div class="letter-list">
            ${entries.map((l, i) => `
                <div class="letter-row">
                    <button onclick="readLetter(${i})">
                        <strong>${l.title}</strong>
                        <small>${l.from} · Read letter ›</small>
                    </button>
                </div>
            `).join("")}
        </div>

        <p class="notice">
            These preview letters are examples only.
            Real contributions will be published only with the writer's permission.
        </p>
    ` : `
        <div class="eyebrow">A page waiting to be written</div>

        <h2>Your words belong here</h2>

        <p class="empty-note">
            As people contribute to the archive, their letters
            will find a home on these pages.
        </p>
    `;

    setPages(left, right, "3", "4");
}


/* READ A LETTER */

function readLetter(index) {

    const letter = (sampleLetters[currentCategory] || [])[index];

    if (!letter) return;

    const left = `
        <div class="eyebrow">${selectedCounty} · From the archive</div>

        <h2>${letter.title}</h2>

        <div class="ornament">❧</div>

        <p class="page-intro">${letter.from}</p>

        <div class="letter-body">${letter.body}</div>

        <div class="letter-signoff">${letter.sign}</div>

        <button class="back-button"
            onclick="showCategory('${currentCategory.replace(/'/g, "\\'")}')">
            ← Back to letters
        </button>
    `;

    const right = `
        <div class="eyebrow">A message for you</div>

        <h2>Take these words with you</h2>

        <p class="empty-note">
            Every letter is a small act of connection.
            Thank you for taking the time to read this one.
        </p>

        <div class="ornament">✧ ☘ ✧</div>

        <button class="back-button"
            onclick="showCategory('${currentCategory.replace(/'/g, "\\'")}')">
            Read another letter
        </button>
    `;

    setPages(left, right, "5", "6");
}
